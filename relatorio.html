<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relatório IPTU atual × potencial · Autha-Geo</title>
<style>
  @page { size: A4; margin: 0; }
  :root { --verde: #1f9d57; --verde2: #4ddf84; --tinta: #0f172a; --cinza: #475569; --linha: #e2e8f0; --fundo: #030712; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #cbd5e1; font-family: "Segoe UI", system-ui, Arial, sans-serif; color: var(--tinta); }
  .barra { position: sticky; top: 0; display: flex; gap: 10px; justify-content: center; padding: 10px; background: #0b1220; }
  .barra button { font: inherit; font-weight: 700; padding: 8px 18px; border-radius: 99px; border: 0; background: var(--verde2); color: #04120a; cursor: pointer; }
  .barra span { color: #cbd5e1; align-self: center; font-size: 14px; }
  .folha { width: 210mm; min-height: 297mm; margin: 12px auto; background: #fff; padding: 14mm 15mm 12mm; position: relative; }
  .topo { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 3px solid var(--verde2); padding-bottom: 6mm; }
  .marca { font-weight: 900; font-size: 22px; } .marca span { color: var(--verde); }
  .topo .direita { text-align: right; font-size: 12px; color: var(--cinza); }
  h1 { font-size: 27px; margin: 6mm 0 1mm; line-height: 1.1; }
  .para { font-size: 14px; color: var(--cinza); margin: 0 0 5mm; }
  .grade { display: grid; grid-template-columns: 78mm 1fr; gap: 6mm; }
  .mapa { width: 78mm; height: 78mm; border-radius: 10px; background: var(--fundo); display: block; }
  .legenda-mapa { font-size: 10px; color: var(--cinza); margin-top: 1.5mm; }
  .numeros { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; align-content: start; }
  .num { border: 1px solid var(--linha); border-radius: 8px; padding: 3mm; }
  .num b { display: block; font-size: 21px; color: var(--verde); line-height: 1.1; }
  .num span { font-size: 11.5px; color: var(--cinza); }
  h2 { font-size: 16px; margin: 7mm 0 2.5mm; padding-bottom: 1.5mm; border-bottom: 1px solid var(--linha); }
  p, li { font-size: 12.5px; line-height: 1.45; }
  .destaque { background: #ecfdf3; border: 1px solid #a7f3c4; border-radius: 10px; padding: 4mm 5mm; margin: 3mm 0; }
  .destaque .valor { font-size: 25px; font-weight: 900; color: var(--verde); }
  .destaque p { margin: 1mm 0 0; }
  table { width: 100%; border-collapse: collapse; font-size: 11px; }
  th, td { text-align: left; padding: 1.6mm 1.5mm; border-bottom: 1px solid var(--linha); vertical-align: top; }
  th { color: var(--cinza); font-weight: 700; }
  td a { color: var(--verde); word-break: break-all; }
  .comparacao { display: grid; grid-template-columns: 1fr 1fr; gap: 3mm; }
  .barra-comp { height: 5mm; background: #f1f5f9; border-radius: 99px; overflow: hidden; margin: 1mm 0 0.5mm; }
  .barra-comp i { display: block; height: 100%; background: var(--verde2); }
  .barra-comp.med i { background: #94a3b8; }
  ol.passos { padding-left: 5mm; margin: 0; }
  .rodape { margin-top: 6mm; border-top: 1px solid var(--linha); padding-top: 3mm; display: flex; justify-content: space-between; font-size: 11px; color: var(--cinza); }
  .rodape b { color: var(--tinta); }
  .nota { font-size: 10px; color: var(--cinza); line-height: 1.4; }
  .erro { padding: 40px; font-size: 18px; }
  @media print { body { background: #fff; } .barra { display: none; } .folha { margin: 0; box-shadow: none; page-break-after: always; } }
</style>
</head>
<body>
<div class="barra"><button onclick="print()">Salvar em PDF / imprimir</button><span>No diálogo, escolha “Salvar como PDF”, papel A4, margens “Nenhuma”.</span></div>
<div id="paginas"></div>

<script src="dados/municipios.js"></script>
<script src="dados/iptu.js"></script>
<script>
"use strict";
const q = new URLSearchParams(location.search);
const cod = q.get("c") || "4204202", nome = q.get("n") || "", cargo = q.get("cargo") || "";
const M = (window.MUNICIPIOS || []).find((m) => m.c === cod);
const V = (window.IPTU || {})[cod], CASOS = window.CASOS_RECADASTRO;
const nf = new Intl.NumberFormat("pt-BR");
const milhar = (n) => nf.format(Math.round(n));
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
function reais(v) {
  const um = (x) => x.toLocaleString("pt-BR", { maximumFractionDigits: 1 });
  if (v >= 1e9) return "R$ " + um(v / 1e9) + " bi";
  if (v >= 1e6) return "R$ " + um(v / 1e6) + " mi";
  if (v >= 1e3) return "R$ " + milhar(v / 1e3) + " mil";
  return "R$ " + milhar(v);
}
const reaisCheio = (v) => v.toLocaleString("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });

function montar() {
  if (!M) { document.getElementById("paginas").innerHTML = `<div class="folha erro">Município ${esc(cod)} não encontrado.</div>`; return; }
  document.title = `Relatório IPTU — ${M.n} · Autha-Geo`;
  const capital = cod === "4205407";
  const data = new Date().toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });
  const para = nome ? `Preparado para <b>${esc(nome)}</b>${cargo ? ", " + esc(cargo) : ""} · ${esc(M.n)} · ${data}` : `${esc(M.n)} · ${data}`;
  let h = `<div class="folha">
    <div class="topo"><div class="marca">Autha<span>-Geo</span></div><div class="direita">Relatório Voo Cadastral · COMAC-SC 2026<br>Raio-X do IPTU municipal</div></div>
    <h1>IPTU atual × potencial<br>${esc(M.n)}</h1>
    <p class="para">${para}</p>
    <div class="grade">
      <div><canvas class="mapa" id="mapa" width="900" height="900"></canvas>
        <div class="legenda-mapa">Cada ponto é uma edificação vista por satélite na área urbana central (área de voo do jogo).</div></div>
      <div class="numeros">
        <div class="num"><b>${milhar(M.edif)}</b><span>edificações no município, vistas por satélite</span></div>
        <div class="num"><b>${milhar(M.edifUrb)}</b><span>dessas, na área urbana (setores do IBGE)</span></div>
        <div class="num"><b>${milhar(M.pop)}</b><span>habitantes (Censo 2022)</span></div>
        ${V ? `<div class="num"><b>${reais(V.v)}</b><span>de IPTU arrecadado em ${V.a}</span></div>` : `<div class="num"><b>—</b><span>IPTU não declarado ao Tesouro no último ano</span></div>`}
      </div>
    </div>`;

  if (V) {
    const maxPc = Math.max(V.pc, V.pcMed), maxPe = Math.max(V.pe, V.peMed);
    const varia = V.v24 && V.b ? (V.b / V.v24 - 1) * 100 : null;
    h += `<h2>1. O IPTU hoje, comparado com municípios do mesmo porte</h2>
      <p>${esc(M.n)} arrecadou <b>${reaisCheio(V.v)}</b> de IPTU em ${V.a}${varia !== null ? ` (${varia >= 0 ? "+" : ""}${varia.toLocaleString("pt-BR", { maximumFractionDigits: 1 })}% sobre ${V.a - 1}, valor bruto)` : ""}.
      Abaixo, a comparação com a mediana dos <b>${V.nPorte} municípios catarinenses de ${esc(V.porte)}</b>: metade deles arrecada mais que a mediana, metade menos.</p>
      <div class="comparacao">
        <div><b>IPTU por habitante</b>
          <div class="barra-comp"><i style="width:${(V.pc / maxPc) * 100}%"></i></div><small>${esc(M.n)}: <b>${reaisCheio(V.pc)}</b></small>
          <div class="barra-comp med"><i style="width:${(V.pcMed / maxPc) * 100}%"></i></div><small>mediana do porte: <b>${reaisCheio(V.pcMed)}</b></small></div>
        <div><b>IPTU por edificação urbana</b>
          <div class="barra-comp"><i style="width:${(V.pe / maxPe) * 100}%"></i></div><small>${esc(M.n)}: <b>${reaisCheio(V.pe)}</b></small>
          <div class="barra-comp med"><i style="width:${(V.peMed / maxPe) * 100}%"></i></div><small>mediana do porte: <b>${reaisCheio(V.peMed)}</b></small></div>
      </div>
      <p>${V.pc < V.pcMed
        ? `Se ${esc(M.n)} chegasse à mediana do porte por habitante, seriam <b>${reais((V.pcMed - V.pc) * M.pop)} a mais por ano</b>. A diferença pode vir de cadastro desatualizado, de planta de valores antiga ou de inadimplência; o recadastramento ataca a primeira, que não depende de lei nova.`
        : `${esc(M.n)} já arrecada acima da mediana do porte. O ganho, aqui, é manter o cadastro vivo: cada ampliação, piscina ou edificação nova que não entra no cadastro é IPTU que deixa de crescer.`}</p>`;
  }

  if (V && CASOS) {
    h += `<h2>2. O que municípios que recadastraram conseguiram</h2>
      <div class="destaque"><div class="valor">+${reais(V.v * CASOS.min / 100)} a +${reais(V.v * CASOS.max / 100)} por ano</div>
      <p>é o que o IPTU de ${esc(M.n)} subiria repetindo o resultado dos casos abaixo (de +${CASOS.min}% a +${CASOS.max}%, a mediana dos casos), <b>sem aumentar alíquota</b>: só levando para o cadastro o que já está construído.</p></div>
      <table><tr><th>Município</th><th>O que mudou</th><th>Aumento</th><th>Fonte</th></tr>
      ${CASOS.casos.map((c) => `<tr><td><b>${esc(c.municipio)}/${esc(c.uf)}</b><br>${esc(c.ano || "")}</td><td>${esc(c.o_que_mede)}: ${esc(c.antes)} → ${esc(c.depois)}<br><small>${esc(c.como_fizeram || "")}</small></td><td><b>+${Number(c.aumento_pct).toLocaleString("pt-BR", { maximumFractionDigits: 1 })}%</b></td><td><a href="${esc(c.fonte_url)}">${esc(c.fonte_titulo || c.fonte_url)}</a></td></tr>`).join("")}
      </table>`;
  }

  h += `<h2>${V && CASOS ? 3 : V ? 2 : 1}. Como a Autha faz</h2>
    <ol class="passos">
      <li><b>Voo de drone</b> com ortofoto de 5 cm e laser (LiDAR): cada telhado medido, inclusive sob árvore.</li>
      <li><b>Vetorização</b> das edificações e confronto com o cadastro imobiliário: aparece a área construída que não está lançada.</li>
      <li><b>Autha-Geo</b>: o cadastro no mapa, com a ficha de cada imóvel, certidões e consulta prévia em 3 cliques.</li>
      <li><b>CIB/SINTER</b>: o cadastro organizado no formato da Receita Federal. ${capital ? "O CIB das capitais já está valendo." : "O CIB é obrigatório para os imóveis urbanos dos municípios a partir de janeiro de 2027."}</li>
    </ol>
    <p class="nota" style="margin-top:6mm">Fontes: edificações — Overture Maps Foundation, release 2026-10-21.0 (inclui Google Open Buildings, Microsoft e OpenStreetMap), cruzadas com os setores censitários do IBGE 2022; população — IBGE, Censo 2022; IPTU — Tesouro Nacional, Siconfi, Declaração de Contas Anuais (Anexo I-C, conta 1.1.1.2.50, receita líquida)${CASOS ? "; casos de recadastramento — fontes indicadas na tabela" : ""}.
    Prédio com vários apartamentos conta como 1 edificação; galpões e aviários entram na contagem. Este relatório é uma estimativa para conversa e não é lançamento de imposto: o potencial real depende do cadastro, da planta de valores e da legislação de cada município.</p>
    <div class="rodape"><span><b>Autha-Geo</b> · cadastro, mapa e CIB para prefeituras</span><span><b>(49) 99971-9388</b> · authamapeamento@gmail.com</span></div>
  </div>`;
  document.getElementById("paginas").innerHTML = h;
  desenharMapa();
}

// mapa: as edificações da área de voo, no estilo do jogo
window.carregarCidade = (c) => {
  const cv = document.getElementById("mapa"); if (!cv) return;
  const g = cv.getContext("2d"), S = cv.width, bin = atob(c.b), n = bin.length / 5;
  g.fillStyle = "#030712"; g.fillRect(0, 0, S, S);
  g.strokeStyle = "rgba(92,215,179,.6)"; g.lineWidth = 2;
  for (const anel of c.limite) { g.beginPath(); anel.forEach(([x, y], i) => (i ? g.lineTo(x * S, y * S) : g.moveTo(x * S, y * S))); g.stroke(); }
  g.fillStyle = "#4ddf84";
  for (let i = 0, o = 0; i < n; i++, o += 5) {
    const x = ((bin.charCodeAt(o) | (bin.charCodeAt(o + 1) << 8)) / 65535) * S, y = ((bin.charCodeAt(o + 2) | (bin.charCodeAt(o + 3) << 8)) / 65535) * S;
    const s = Math.max(1, (bin.charCodeAt(o + 4) / 5 / c.lado) * S * 0.9);
    g.fillRect(x - s / 2, y - s / 2, s, s);
  }
  g.fillStyle = "rgba(248,250,252,.8)"; g.font = "600 22px Segoe UI, sans-serif";
  g.fillText(`${(c.lado / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 })} km × ${(c.lado / 1000).toLocaleString("pt-BR", { maximumFractionDigits: 1 })} km`, 18, S - 20);
};
function desenharMapa() { const s = document.createElement("script"); s.src = `cidades/${cod}.js`; document.body.appendChild(s); }
montar();
</script>
</body>
</html>
